name: TaskBoard Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Unit Tests & Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: |
          pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend Application
        working-directory: frontend
        run: |
          npm install
          npm run build

  build-scan-push:
    name: Build Containers & DevSecOps Scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_OWNER}/taskboard-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_OWNER}/taskboard-frontend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend & Frontend Docker Images
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} ./backend
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ./frontend

      - name: Trivy Security Scan - Backend Image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy Security Scan - Frontend Image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Container Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes Cluster via Helm
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_OWNER}/taskboard-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_OWNER}/taskboard-frontend" >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Deploy with Helm
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=${{ env.IMAGE_BACKEND }} \
            --set frontend.image=${{ env.IMAGE_FRONTEND }}
